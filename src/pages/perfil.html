<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Minha Lista Tranquila</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body class="login-page">
    <!-- Reusing login-page utility for specific button/input tweaks if needed, or stick to default and use classes -->
    <div class="container">

        <header>
            <div class="header-content">
                <h1>Seu espaço</h1>
                <p>Ajustes simples, no seu tempo.</p>
            </div>
            <!-- No profile icon here since we are here -->
        </header>

        <form onsubmit="return false;">
            <div class="form-group">
                <label for="name">Nome (Visível para você)</label>
                <input type="text" id="name" class="input-main" value="Visitante Tranquilo" readonly
                    style="color: var(--text-secondary); cursor: default;">
            </div>

            <div class="form-group">
                <label for="language">Idioma</label>
                <input type="text" id="language" class="input-main" value="Português (BR)" readonly
                    style="cursor: default;">
            </div>
        </form>

        <div style="margin-top: 48px; border-top: 1px solid var(--border-color); padding-top: 24px;">
            <a href="../index.html" class="link-secondary"
                style="text-align: center; color: var(--text-secondary); font-size: 14px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span class="material-icons-round" style="font-size: 18px;">logout</span>
                Sair do meu espaço
            </a>
        </div>

    </div>

    <!-- Navegação Inferior (Para voltar facilmente) -->
    <nav class="bottom-nav">
        <div class="nav-content">
            <a href="lista.html" class="nav-item">
                <span class="material-icons-round">list</span>
                <span>Lista</span>
            </a>
            <a href="painel.html" class="nav-item">
                <span class="material-icons-round">dashboard</span>
                <span>Painel</span>
            </a>
        </div>
    </nav>
</body>

</html>
